<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>textstats — 稿件字数与可读性</title>
<meta name="description" content="统计稿件字数、段落、阅读与播报时长，找出长句和重复用词。全部在浏览器本地运行，稿件不上传。" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="back" href="https://icgma.github.io/newsroom-kit/" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M10.3 3.3 5.6 8l4.7 4.7 1.4-1.4L8.4 8l3.3-3.3-1.4-1.4Z"/></svg>
      </a>
      <span class="dot" aria-hidden="true"></span>
      <span class="wordmark">textstats</span>
      <span class="tag">字数与可读性</span>
    </div>
    <div class="topbar-right">
      <span class="privacy" title="所有统计都在你的浏览器里完成">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 1 2 3v5c0 4 2.5 6.5 6 7.5 3.5-1 6-3.5 6-7.5V3L8 1Zm0 2 4 1.3v3.7c0 3-1.8 4.9-4 5.6-2.2-.7-4-2.6-4-5.6V4.3L8 3Z"/></svg>
        稿件不上传
      </span>
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <svg class="ico-moon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <span id="themeLabel">浅色</span>
      </button>
    </div>
  </header>

  <div class="layout layout-stats">
    <main class="main">
      <div class="main-head">
        <div class="main-title">
          <h1>稿件体检</h1>
          <p>粘贴稿件，实时看字数、时长、长句和重复用词。</p>
        </div>
        <div class="main-controls">
          <div class="options">
            <label class="opt">默读
              <select id="optReadSpeed">
                <option value="300" selected>300 字/分</option>
                <option value="400">400 字/分</option>
                <option value="500">500 字/分</option>
              </select>
            </label>
            <label class="opt">播报
              <select id="optSpeakSpeed">
                <option value="220">220 字/分</option>
                <option value="240" selected>240 字/分</option>
                <option value="260">260 字/分</option>
              </select>
            </label>
            <label class="opt">长句阈值
              <select id="optLongLimit">
                <option value="40">40 字</option>
                <option value="50" selected>50 字</option>
                <option value="70">70 字</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <section class="pane pane-editor">
          <div class="pane-head">
            <label for="input">稿件</label>
            <div class="pane-actions">
              <button class="iconbtn" data-act="sample" title="填入示例">示例</button>
              <button class="iconbtn" data-act="paste" title="粘贴">粘贴</button>
              <button class="iconbtn" data-act="clear-input" title="清空">清空</button>
            </div>
          </div>
          <textarea id="input" spellcheck="false" placeholder="把稿件粘贴到这里。" aria-label="稿件"></textarea>
          <div class="pane-foot"><span id="inputCount">0 字</span></div>
        </section>

        <aside class="report" aria-label="统计结果">
          <div class="cards" id="cards"></div>

          <section class="card card-block">
            <h2>时长估算</h2>
            <div class="duration-rows" id="durations"></div>
            <p class="card-note">按纯汉字节奏估算，实际以录播为准。</p>
          </section>

          <section class="card card-block">
            <h2>长句提示 <span class="badge" id="longCount">0</span></h2>
            <ol class="long-list" id="longList"></ol>
            <p class="card-note" id="longNote">超过阈值的句子容易读断气，建议拆分。</p>
          </section>

          <section class="card card-block">
            <h2>重复词组 <span class="badge" id="repeatCount">0</span></h2>
            <ul class="repeat-list" id="repeatList"></ul>
            <p class="card-note">按 2–4 字连续片段统计，用于发现啰嗦或口头禅，不是分词。</p>
          </section>
        </aside>
      </div>

      <div class="statusbar">
        <span id="status" class="status ready">就绪</span>
        <span class="hint" id="hint"></span>
      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="footer-meta">
      <span>Built with <strong>GLM-5.2</strong></span>
      <span class="sep desktop-only">·</span>
      <span class="desktop-only">作者 <span class="footer-author">icgma</span></span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/textstats" target="_blank" rel="noopener">源码</a>
    </div>
    <div class="footer-meta">
      <span class="desktop-only">纯前端 · 数据不上传</span>
    </div>
  </footer>
</div>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
